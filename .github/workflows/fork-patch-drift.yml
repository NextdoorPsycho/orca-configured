name: fork-patch-drift

# Runs on EVERY push to main (fork-release.yml only rebuilds on fork/** pushes):
# a source-only push that forgot `node fork/export-patches.mjs` would otherwise
# leave the patch set silently stale — releases would build without the change.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # export-patches diffs against fork/upstream-base, which needs history.
          fetch-depth: 0

      - name: Verify patches match main
        run: node fork/export-patches.mjs --check

      - name: Verify fork version scheme
        # semver installs into RUNNER_TEMP (a bare npm install fights the repo's
        # pnpm pin); NODE_PATH lets the self-test's require() find it there.
        run: |
          npm install --prefix "$RUNNER_TEMP/semver-probe" semver
          NODE_PATH="$RUNNER_TEMP/semver-probe/node_modules" node fork/fork-release-version.mjs --test
